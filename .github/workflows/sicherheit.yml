# Sicherheits-CI (BSI M6): Waechter, Abhaengigkeits-Audit, SBOM, SAST, Secret-Scan.
#
# Vorher lief in der CI nur der Docker-Bau – keine Tests, kein pip-audit/npm audit,
# keine SBOM, kein Secret-Scanning (BSI-Abgleich ECHT, 2026-09-29).
#
# Ausnahmen sind DATEIEN im Repo, nicht Schalter in diesem Workflow – jede mit Grund:
#   tests/ci_ausnahmen.txt            Waechter, die in der CI nicht laufen koennen
#   deploy/security/pip_audit_ausnahmen.txt   bewertete Python-Schwachstellen (mit Pruefdatum)
#   .gitleaksignore                   gepruefte Fehlalarme (Platzhalter, Testwerte)
name: Sicherheit

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    # Woechentlich auch ohne Commit: neue CVEs betreffen den unveraenderten Stand
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:

  # ── Python: Waechter + pip-audit + SBOM ──────────────────────────────────────
  python:
    name: Python – Waechter, pip-audit, SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6 (Commit gepinnt, Code-Review 2026-10-18)
        with:
          # Ganze Historie: test_secret_key_platzhalter liest alte Staende per git
          fetch-depth: 0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6 (Commit gepinnt, Code-Review 2026-10-18)
        with:
          python-version: '3.13'

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6 (Commit gepinnt, Code-Review 2026-10-18)
        with:
          node-version: '24'

      # Wie auf den Servern (DEV gemessen 2026-10-06): ohne wngerman entscheidet
      # die PDF-Qualitaetspruefung anders (backend/tools/knowledge.py::_wortliste),
      # ohne bubblewrap/User-Namespaces brechen die Sandbox-Waechter mit Exit 2 ab.
      # ffmpeg: test_stt_fern wandelt echte Audiodateien um und endet ohne es
      # ehrlich mit Exit 2 (seit 2026-10-25 so, verdeckt bis 2026-10-26 hinter
      # dem pip-audit-Abbruch).
      - name: Systempakete (OCR/PDF, Wortliste, Sandbox, ffmpeg wie auf den Servern)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            tesseract-ocr tesseract-ocr-deu poppler-utils wngerman bubblewrap ffmpeg >/dev/null
          # Ubuntu 24.04 sperrt unprivilegierte User-Namespaces per AppArmor;
          # Debian (die Server) nicht. unshare -r / bwrap brauchen sie.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      # MIT-KDC fuer test_kerberos_kdc.py – ENTPACKT, nicht installiert: das
      # Paket krb5-kdc wuerde beim Installieren einen Dienst ohne Realm starten
      # wollen. Ohne diesen Schritt endet der Waechter mit Exit 2, und das faellt
      # den ganzen Lauf (so seit dem Kerberos-Commit 2026-10-20 in jedem Lauf).
      - name: MIT-KDC als Paketbaum (Kerberos-Durchstich)
        run: |
          mkdir -p "$RUNNER_TEMP/krb5-deb" "$RUNNER_TEMP/krb5"
          cd "$RUNNER_TEMP/krb5-deb"
          # ⚠ KEINE feste Paketliste: die Bibliotheksnamen weichen zwischen
          # Debian und Ubuntu ab (libverto-libev1t64 gibt es auf 24.04 nicht,
          # Lauf 39590372478). Geholt wird jede rekursive Abhaengigkeit, die
          # auf dem Runner NICHT installiert ist – Systembibliotheken (libc)
          # bleiben damit aussen vor. Fremdarchitekturen (":i386") ausgefiltert,
          # sie ueberschreiben sonst die 64-Bit-Programme im Baum.
          PAKETE="krb5-kdc krb5-admin-server krb5-user"
          DEPS=$(apt-cache depends --recurse --no-recommends --no-suggests \
            --no-conflicts --no-breaks --no-replaces --no-enhances $PAKETE \
            | grep -E '^[a-z0-9][^:]*$' | sort -u)
          FEHLEND=$(for d in $DEPS; do
            dpkg-query -W -f='${Status}' "$d" 2>/dev/null | grep -q "install ok installed" || echo "$d"
          done)
          echo "hole: $FEHLEND"
          apt-get download $FEHLEND
          for f in *.deb; do dpkg-deb -x "$f" "$RUNNER_TEMP/krb5"; done
          echo "KRB5_TESTWURZEL=$RUNNER_TEMP/krb5" >> "$GITHUB_ENV"

      # Aus der Lock mit Hash-Pruefung (2026-10-21) – pip-audit und SBOM sehen
      # damit GENAU den festgelegten Stand. Vorher stand die torch-Fassung hier
      # ein zweites Mal von Hand; jetzt kommt sie (samt Hash) aus der Lock.
      - name: venv + Abhaengigkeiten (requirements.lock, --require-hashes)
        run: |
          python -m venv venv
          venv/bin/pip install -q --upgrade pip
          venv/bin/pip install -q --require-hashes -Ccompile-args=-j2 \
            --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.lock
          venv/bin/pip check

      # Werkzeuge in EIGENER venv: in der Dienst-venv installiert, wuerde pip-audit
      # sich selbst und seine Abhaengigkeiten mitpruefen und die SBOM verfaelschen.
      - name: Werkzeuge (pip-audit, CycloneDX)
        run: |
          python -m venv werkzeug
          werkzeug/bin/pip install -q pip-audit cyclonedx-bom

      - name: pip-audit (bekannte Schwachstellen)
        run: |
          # Ausnahmen: "ID  JJJJ-MM-TT  # Grund"; abgelaufen oder ohne Grund -> rot
          ARGS=$(python3 deploy/security/pip_audit_ausnahmen.py --argumente)
          werkzeug/bin/pip-audit --progress-spinner off \
            --path "$(ls -d venv/lib/python3*/site-packages)" $ARGS

      - name: SBOM (CycloneDX) der Python-Umgebung
        if: always()
        run: werkzeug/bin/cyclonedx-py environment venv --output-format JSON --output-file sbom-python.cdx.json

      # Skill-Locks (skills/*/requirements.lock, seit 2026-10-27, BSI-Abgleich der
      # AI-Maus-Pakete): diese Pakete installiert der Server beim Einschalten bzw.
      # beim Start nach – Audit und SBOM oben sehen nur die Kern-Lock. ERST NACH
      # deren SBOM, damit die genau den Kern-Stand zeigt; die Skill-SBOM ist eine
      # eigene Datei. --no-deps wie auf dem Server: der Baum steht vollstaendig in
      # der Lock, und Kernpakete stehen dort mit derselben Version
      # (tests/test_skill_lock.py), die Installation bewegt also keines.
      - name: Skill-Locks – Installation, pip-audit, SBOM
        if: always()
        run: |
          for f in skills/*/requirements.lock; do
            echo "== $f"
            venv/bin/pip install -q --require-hashes --no-deps -r "$f"
          done
          venv/bin/pip check
          ARGS=$(python3 deploy/security/pip_audit_ausnahmen.py --argumente)
          werkzeug/bin/pip-audit --progress-spinner off \
            --path "$(ls -d venv/lib/python3*/site-packages)" $ARGS
          werkzeug/bin/cyclonedx-py environment venv --output-format JSON --output-file sbom-python-skills.cdx.json

      # ⚠ OHNE PAKETNAMEN - die Fassungen stehen in package.json und sind dort
      # FESTGENAGELT (keine ^-Spanne). Vorher stand hier "jsdom acorn", also
      # bei JEDEM Lauf die jeweils aktuelle Fassung, waehrend der Arbeitsplatz
      # seine installierte behielt. Am 2026-10-11 war genau dieser Unterschied
      # zweimal die Ursache fuer "lokal gruen, CI rot" - und beide Male sah es
      # wie ein Produktfehler aus: der Excel-Waechter (jsdom 25 gegen 30) und
      # test_review_niedrig_ui (border-color wird erst ab jsdom 30 als
      # "currentcolor" serialisiert). tests/test_pruefwerkzeug_pin.js
      # vergleicht das INSTALLIERTE gegen den Pin und meldet jede Abweichung.
      - name: jsdom + acorn fuer die UI-Waechter (Fassungen aus package.json)
        run: npm install --no-save --no-audit --no-fund

      # exchangelib ist eine SKILL-Abhaengigkeit (skills/email/skill.json, beim
      # Aktivieren installiert) und steht deshalb nicht in der Lock. Ohne sie
      # fehlt test_email_rules die Adapter-Probe -> Exit 2. Installiert wird
      # ERST HIER, nach pip-audit und SBOM: die sollen genau den Stand der Lock
      # zeigen. Fassung wie auf ECHT (gemessen 2026-10-26).
      - name: exchangelib fuer die Adapter-Probe (Skill-Abhaengigkeit, nicht in der Lock)
        run: venv/bin/pip install -q exchangelib==5.6.0

      - name: Waechter (tests/test_*.py, tests/test_*.js)
        run: venv/bin/python tests/ci_lauf.py --parallel 4 --zeitdeckel 300 --ausnahmen-pruefen

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4  # v5 (Commit gepinnt, Code-Review 2026-10-18)
        if: always()
        with:
          name: sbom-python
          path: |
            sbom-python.cdx.json
            sbom-python-skills.cdx.json
          if-no-files-found: warn

  # ── Node: npm audit + SBOM der WhatsApp-Bridge ──────────────────────────────
  node:
    name: Node – npm audit, SBOM (WhatsApp-Bridge)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/whatsapp-bridge
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6 (Commit gepinnt, Code-Review 2026-10-18)
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6 (Commit gepinnt, Code-Review 2026-10-18)
        with:
          node-version: '24'
      - name: npm ci
        run: npm ci --omit=dev --no-fund
      - name: npm audit (ab "moderate")
        run: npm audit --omit=dev --audit-level=moderate
      - name: SBOM (CycloneDX)
        if: always()
        run: npx --yes @cyclonedx/cyclonedx-npm@4 --omit dev --output-format JSON --output-file ../../sbom-whatsapp-bridge.cdx.json
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4  # v5 (Commit gepinnt, Code-Review 2026-10-18)
        if: always()
        with:
          name: sbom-whatsapp-bridge
          path: sbom-whatsapp-bridge.cdx.json
          if-no-files-found: warn

  # ── Go: govulncheck des Windows-Clients ─────────────────────────────────────
  # ⚠ WARUM (2026-10-21): go.mod stand auf "go 1.25.0" ohne toolchain-Zeile, also
  # wurde mit GENAU go1.25.0 gebaut – ohne jede Patch-Fassung. govulncheck fand
  # damit 38 vom Code ERREICHTE Schwachstellen (crypto/tls, x509, net/http …),
  # Dependabot sieht die Standardbibliothek gar nicht. Die Toolchain kommt aus der
  # toolchain-Zeile in go.mod, und govulncheck wird MIT ihr gebaut: ein aelteres
  # govulncheck bricht an neueren Quelltexten der Standardbibliothek ab
  # ("file requires newer Go version") statt zu pruefen.
  # cgo + GOOS=windows wie in build.sh – ohne mingw fehlen fyne/malgo die Typen,
  # und govulncheck meldet Uebersetzungsfehler statt Befunde.
  go:
    name: Go – govulncheck (Windows-Client)
    runs-on: ubuntu-latest
    # 40 statt 20 Minuten nur fuer den ersten Lauf ohne Paket-Zwischenspeicher
    # (siehe unten); mit gefuelltem Speicher braucht der Job wenige Minuten.
    timeout-minutes: 40
    defaults:
      run:
        working-directory: windows-app-go
    env:
      GOVULNCHECK_VERSION: 'v1.9.0'
      CYCLONEDX_GOMOD_VERSION: 'v1.12.0'
      APT_ABLAGE: ${{ github.workspace }}/.apt-mingw
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6 (Commit gepinnt, Code-Review 2026-10-18)
      # ⚠ PAKET-ZWISCHENSPEICHER (2026-10-26): der Ubuntu-Spiegel des Runners
      # lieferte zweimal hintereinander nur ~40 KB/s – die rund 100 MB mingw
      # liefen in den 20-Minuten-Deckel, und der ganze Sicherheitslauf stand auf
      # "cancelled", obwohl nichts am Code war. Die .deb-Dateien liegen jetzt in
      # APT_ABLAGE (apt Dir::Cache::Archives) und werden zwischengespeichert.
      # Schluessel: Runner-Abbild + Paketliste – ein neues Abbild bringt evtl.
      # neue Paketfassungen, dann wird einmal frisch geladen.
      # ImageOS/ImageVersion stehen nur in der Prozessumgebung des Runners,
      # NICHT im env-Kontext der Workflow-Ausdruecke – daher dieser Schritt.
      - name: Schluessel des Zwischenspeichers (Runner-Abbild)
        id: abbild
        run: echo "kennung=${ImageOS:-unbekannt}-${ImageVersion:-unbekannt}" >> "$GITHUB_OUTPUT"
      - name: mingw-Pakete aus dem Zwischenspeicher
        id: aptcache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0 (Commit gepinnt)
        with:
          path: .apt-mingw/*.deb
          key: apt-mingw-${{ steps.abbild.outputs.kennung }}-gcc-g++-x86-64
          restore-keys: |
            apt-mingw-
      - name: mingw-w64 (cgo-Cross-Bau fuer Windows)
        run: |
          # apt laedt als _apt herunter und braucht dafuer ein schreibbares partial/
          mkdir -p "$APT_ABLAGE/partial"
          sudo chown -R _apt:root "$APT_ABLAGE/partial"
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            -o Dir::Cache::Archives="$APT_ABLAGE" \
            gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64
          ls "$APT_ABLAGE"/*.deb | wc -l
      # Sofort sichern, nicht erst am Jobende: scheitert govulncheck danach,
      # muss der naechste Lauf die 100 MB trotzdem nicht erneut laden.
      - name: mingw-Pakete zwischenspeichern
        if: steps.aptcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0 (Commit gepinnt)
        with:
          path: .apt-mingw/*.deb
          key: apt-mingw-${{ steps.abbild.outputs.kennung }}-gcc-g++-x86-64
      - name: govulncheck (Toolchain aus go.mod)
        run: |
          tc=$(awk '$1 == "toolchain" {print $2}' go.mod)
          if [ -z "$tc" ]; then echo "go.mod ohne toolchain-Zeile" >&2; exit 1; fi
          export GOTOOLCHAIN="$tc"
          go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"
          CGO_ENABLED=1 GOOS=windows GOARCH=amd64 \
          CC=x86_64-w64-mingw32-gcc CXX=x86_64-w64-mingw32-g++ \
            "$(go env GOPATH)/bin/govulncheck" ./...
      # SBOM im app-Modus mit -std: so steht auch die Standardbibliothek samt
      # Fassung drin – genau die lag hier ungepatcht (2026-10-21), und der
      # mod-Modus fuehrt sie nicht. Lokal scheitert das Werkzeug an einem Klon
      # mit extensions.worktreeConfig; der frische CI-Checkout hat sie nicht.
      - name: SBOM (CycloneDX)
        if: always()
        run: |
          tc=$(awk '$1 == "toolchain" {print $2}' go.mod)
          export GOTOOLCHAIN="$tc"
          go install "github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@${CYCLONEDX_GOMOD_VERSION}"
          CGO_ENABLED=1 GOOS=windows GOARCH=amd64 CC=x86_64-w64-mingw32-gcc \
            "$(go env GOPATH)/bin/cyclonedx-gomod" app -json -std -licenses=false \
            -output ../sbom-go.cdx.json -main .
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4  # v5 (Commit gepinnt, Code-Review 2026-10-18)
        if: always()
        with:
          name: sbom-go
          path: sbom-go.cdx.json
          if-no-files-found: warn

  # ── Android: SBOM der App ───────────────────────────────────────────────────
  # Nur die AUSGELIEFERTE App (releaseRuntimeClasspath, in app/build.gradle.kts
  # festgelegt) – ohne die Grenze kaemen junit/hamcrest aus den Tests mit. Der
  # Runner bringt JDK 17 und das Android-SDK (ANDROID_HOME) mit; die Gradle-
  # Distribution prueft der Wrapper gegen distributionSha256Sum. Eine fehlende
  # Release-Signatur (keystore.properties ist gitignored) ist nur eine Warnung.
  android:
    name: Android – SBOM (App)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6 (Commit gepinnt, Code-Review 2026-10-18)
      - name: SBOM (CycloneDX)
        run: ./gradlew --no-daemon -q :app:cyclonedxDirectBom
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4  # v5 (Commit gepinnt, Code-Review 2026-10-18)
        if: always()
        with:
          name: sbom-android
          path: android/app/build/reports/cyclonedx-direct/bom.json
          if-no-files-found: warn

  # ── SAST: bandit, nur hohe Schwere UND hohe Sicherheit ──────────────────────
  # Bewusst eng: der Lauf soll bei einem NEUEN schweren Fund rot werden, nicht
  # dauerhaft rot sein. Bestehende, gewollte Stellen tragen "# nosec Bxxx" mit
  # Begruendung in der Zeile darueber.
  sast:
    name: SAST – bandit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6 (Commit gepinnt, Code-Review 2026-10-18)
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6 (Commit gepinnt, Code-Review 2026-10-18)
        with:
          python-version: '3.13'
      - run: pip install -q bandit
      - run: bandit -q -r backend skills -lll -iii

  # ── Secret-Scanning: gitleaks ueber die GANZE Historie ──────────────────────
  # Die Binaerdatei direkt (nicht gitleaks-action: die verlangt fuer
  # Organisationskonten eine Lizenz), Version + Pruefsumme festgeschrieben.
  secrets:
    name: Secret-Scan – gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GITLEAKS_VERSION: '8.28.0'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6 (Commit gepinnt, Code-Review 2026-10-18)
        with:
          fetch-depth: 0
      - name: gitleaks holen und pruefen
        run: |
          f="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -fsSL -o "$f" "$base/$f"
          curl -fsSL -o checksums.txt "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " $f\$" checksums.txt | sha256sum -c -
          tar xzf "$f" gitleaks
      - name: gitleaks (Historie)
        run: ./gitleaks git --no-banner --redact --exit-code 1 .
