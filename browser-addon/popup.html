<!DOCTYPE html>
<!-- `neutral` ist der AUSGANGSZUSTAND, nicht die Ausnahme: solange keine
     Hausfarbe bekannt ist, trägt der Hauptknopf einen schlichten Umriss statt
     einer Produktfarbe. popup.js NIMMT die Klasse weg, sobald eine Farbe da
     ist – die Richtung ist Absicht: fällt das Skript aus oder ist gar kein
     Branding eingerichtet, bleibt es neutral. Umgekehrt (Klasse per JS setzen)
     würde bei jedem Öffnen kurz die falsche Farbe aufblitzen. -->
<html lang="de" class="neutral">
<head>
  <meta charset="UTF-8">
  <title>{marke} für Jira</title>
  <!-- DIE MARKE STEHT ALS VORGABE IM PAKET – und das ist der Kern des Fixes:
       beim allerersten Öffnen ist noch keine Serveradresse hinterlegt, das
       Fenster kann `/api/branding` also gar nicht fragen. Genau dann sieht
       jemand die ANMELDEMASKE zum ersten Mal, und dort stand deshalb der
       eingebaute Rückfall.
       Gefüllt wird das Feld beim Bauen des ZIP (jira_assist._popup_gebrandet);
       im Repo bleibt es LEER, damit hier keine zweite Wahrheit neben dem
       Branding entsteht. Ohne Eintrag gilt unverändert der Rückfall aus
       popup.js. -->
  <meta name="marke" content="">
  <!-- DIE HAUSFARBE AUS DEMSELBEN GRUND. Gemeldet 2026-08-28: "der Anmelden-
       Knopf ist weiterhin nicht in der Branding-Farbe". Zu Recht – die Farbe
       kam bis dahin AUSSCHLIESSLICH aus `/api/branding`, und der Abruf startet
       erst, wenn eine Adresse im Feld steht. Auf der Anmeldemaske gibt es die
       noch nicht: genau dort war der Knopf also nie gebrandet.
       Erlaubt ist nur `#rgb`/`#rrggbb` – der Wert wird als CSS gesetzt, ein
       freier Text darin wäre eine Einschleusung. Leer = neutraler Knopf. -->
  <meta name="akzent" content="">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="kopf">
    <!-- Marke und Logo folgen dem Branding des Servers (popup.js::setzeBranding).
         Bis dahin trägt der Platzhalter die Vorgabe aus dem Paket (siehe
         <meta name="marke">) und erst danach den eingebauten Rückfall – das
         Fenster ist sichtbar, bevor irgendein Abruf zurück ist. -->
    <img class="marke-logo" id="marke-logo" alt="" hidden>
    <span class="marke" id="marke">{marke}</span>
    <span class="ticket" id="ticket-anzeige"></span>
    <button type="button" id="btn-abmelden" class="leise" hidden>Abmelden</button>
  </header>

  <!-- Einrichtung / Anmeldung -->
  <section id="bereich-login">
    <label class="feld">
      <span>{marke}-Adresse</span>
      <input type="url" id="f-basis" placeholder="https://dp.firma.de" autocomplete="off">
    </label>
    <p class="hinweis">
      Genau der Name, auf den das Serverzertifikat lautet – nicht die IP-Adresse.
    </p>
    <label class="feld">
      <span>Benutzer</span>
      <input type="text" id="f-benutzer" autocomplete="username">
    </label>
    <label class="feld">
      <span>Kennwort</span>
      <input type="password" id="f-kennwort" autocomplete="current-password">
    </label>
    <label class="feld">
      <span>Code der Zwei-Faktor-App <em>(nur falls eingerichtet)</em></span>
      <input type="text" id="f-totp" inputmode="numeric" autocomplete="one-time-code">
    </label>
    <button type="button" id="btn-anmelden" class="haupt">Anmelden</button>
  </section>

  <!-- Arbeitsbereich -->
  <section id="bereich-arbeit" hidden>
    <div class="knopfreihe">
      <button type="button" id="btn-zusammenfassung" class="haupt">Zusammenfassen</button>
      <button type="button" id="btn-antwort" class="haupt">Antwort vorschlagen</button>
      <button type="button" id="btn-ueberarbeiten" class="haupt">Überarbeiten</button>
    </div>
    <!-- Die Voraussetzung ist unsichtbar und muss deshalb dastehen: das Feld
         wird über den zuletzt gesetzten Cursor gefunden. Ohne diesen Satz
         drückt jemand den Knopf und bekommt „kein Text gefunden“, ohne zu
         wissen, was er anders machen soll. -->
    <p class="hinweis" id="ueberarb-hinweis">
      <b>Überarbeiten</b> liest den Entwurf aus dem Kommentarfeld, in dem zuletzt
      der Cursor stand, und gleicht ihn mit dem Ticketverlauf ab.
    </p>

    <!-- Vorlage für die Zusammenfassung. Das Zahnrad öffnet die Verwaltung –
         eigene Vorlagen darf jeder anlegen, gemeinsame nur ein Administrator. -->
    <label class="feld">
      <span>Vorlage für die Zusammenfassung</span>
      <div class="feld-zeile">
        <select id="f-vorlage">
          <option value="">Standard</option>
        </select>
        <button type="button" id="btn-vorlagen" class="leise ico"
                title="Vorlagen verwalten" aria-label="Vorlagen verwalten">⚙</button>
      </div>
    </label>

    <label class="feld">
      <span>Zusatzwunsch <em>(optional)</em></span>
      <input type="text" id="f-hinweis" placeholder="z. B. kurz halten, auf Englisch">
    </label>

    <!-- Vorlagen-Verwaltung: bleibt im selben Fenster, damit die Auswahl
         daneben sichtbar bleibt. -->
    <div id="vorlagen-box" hidden>
      <div class="vorl-kopf">
        <b>Vorlagen</b>
        <button type="button" id="btn-vorlagen-zu" class="leise" title="Schließen"
                aria-label="Schließen">&times;</button>
      </div>
      <ul class="vorl-liste" id="vorl-liste"></ul>
      <label class="feld">
        <span>Name</span>
        <input type="text" id="f-vorl-name" maxlength="60" placeholder="z. B. Kurz für die Leitung">
      </label>
      <label class="feld">
        <span>Anweisung</span>
        <textarea id="f-vorl-text" rows="4"
                  placeholder="Worauf soll die Zusammenfassung hinauslaufen?"></textarea>
      </label>
      <label class="feld" id="vorl-global-zeile" hidden>
        <span><input type="checkbox" id="f-vorl-global"> Für alle Benutzer (Administrator)</span>
      </label>
      <div class="knopfreihe">
        <button type="button" id="btn-vorl-speichern" class="haupt">Speichern</button>
        <button type="button" id="btn-vorl-neu" class="leise">Neu</button>
      </div>
      <p class="hinweis" id="vorl-hinweis"></p>
    </div>

    <div id="ergebnis" hidden>
      <textarea id="f-ergebnis" rows="12" spellcheck="true"></textarea>
      <div class="knopfreihe">
        <button type="button" id="btn-einfuegen">Ins Kommentarfeld einfügen</button>
        <button type="button" id="btn-kopieren" class="leise">Kopieren</button>
      </div>
      <p class="fussnote" id="ergebnis-fuss"></p>
    </div>

    <!-- Rückfrage, wenn der gemerkte Text zu einem anderen Ticket gehört.
         Eigener Dialog statt confirm() – siehe popup.js::frageJaNein. -->
    <div class="ja-nein" id="ja-nein" hidden>
      <p id="jn-text">Der Text gehört zu einem <b>anderen Ticket</b>. Trotzdem einfügen?</p>
      <div class="knopfreihe">
        <button type="button" id="jn-nein" class="leise">Abbrechen</button>
        <button type="button" id="jn-ja">Trotzdem einfügen</button>
      </div>
    </div>
  </section>

  <p id="meldung" class="meldung" hidden></p>

  <script type="module" src="popup.js"></script>
</body>
</html>
