<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>{marke} für Jira</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="kopf">
    <!-- Marke und Logo folgen dem Branding des Servers (popup.js::setzeBranding).
         Der Rückfalltext steht hier, weil das Fenster vor dem ersten Abruf
         schon sichtbar ist. -->
    <img class="marke-logo" id="marke-logo" alt="" hidden>
    <span class="marke" id="marke">Jarvis</span>
    <button type="button" id="btn-abmelden" class="leise" hidden>Abmelden</button>
  </header>

  <!-- Dieses Fenster ist NUR für Anmeldung und Einrichtung.
       Gearbeitet wird im Panel, das der Klick auf das Symbol in die Jira-Seite
       einsetzt: ein Popup schließt, sobald der Benutzer daneben klickt – also
       genau dann, wenn er ins Kommentarfeld wechselt. -->
  <section id="bereich-login">
    <label class="feld">
      <span>{marke}-Adresse</span>
      <input type="url" id="f-basis" placeholder="https://dp.firma.de" autocomplete="off">
    </label>
    <p class="hinweis">
      Genau der Name, auf den das Serverzertifikat lautet – nicht die IP-Adresse.
    </p>
    <label class="feld">
      <span>Benutzer</span>
      <input type="text" id="f-benutzer" autocomplete="username">
    </label>
    <label class="feld">
      <span>Kennwort</span>
      <input type="password" id="f-kennwort" autocomplete="current-password">
    </label>
    <label class="feld">
      <span>Code der Zwei-Faktor-App <em>(nur falls eingerichtet)</em></span>
      <input type="text" id="f-totp" inputmode="numeric" autocomplete="one-time-code">
    </label>
    <button type="button" id="btn-anmelden" class="haupt">Anmelden</button>
  </section>

  <!-- Nach der Anmeldung: der Weg zur Arbeitsfläche. Ohne diesen Hinweis endet
       die Einrichtung in einem Fenster, das nichts mehr anbietet – und niemand
       käme darauf, dass der nächste Klick auf dasselbe Symbol etwas anderes
       tut. -->
  <section id="bereich-bereit" hidden>
    <p class="bereit">✓ Angemeldet.</p>
    <p class="hinweis">
      Öffne ein Jira-Ticket (…/browse/ABC-1234) und klicke erneut auf das Symbol.
      Der Assistent erscheint dann <b>rechts in der Jira-Seite</b> und bleibt dort
      stehen, auch wenn du woanders hin klickst.
    </p>
  </section>

  <p id="meldung" class="meldung" hidden></p>

  <script src="popup.js"></script>
</body>
</html>
