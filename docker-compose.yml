# ──────────────────────────────────────────────────────────────────────────────
# Jarvis AI Desktop Agent – Docker Compose
# Startet Jarvis Web-UI + VNC-Desktop + WhatsApp-Bridge (alles in einem Container)
#
# Schnellstart:
#   docker compose up -d
#   Browser: https://<server-ip>  (SSL-Warnung bestätigen)
#   Login:   jarvis / Erstkennwort aus  docker logs jarvis | grep Erstkennwort
#            (oder JARVIS_PASSWORD setzen; Wechsel beim ersten Login ist Pflicht)
# ──────────────────────────────────────────────────────────────────────────────

services:

  # ── Jarvis Haupt-Container (inkl. WhatsApp-Bridge) ────────────────────────
  jarvis:
    image: ghcr.io/dev-core-busy/jarvis:latest
    container_name: jarvis
    restart: unless-stopped
    ports:
      - "80:80"       # HTTP → HTTPS Redirect
      - "443:443"     # Web-UI (HTTPS)
      # 6080 (noVNC) bewusst NICHT veroeffentlicht: dahinter haengt x11vnc ohne
      # Kennwort. Der Desktop laeuft ueber 443 (/novnc + /ws/vnc, mit Anmeldung).
    environment:
      # Docker-Modus aktivieren (deaktiviert PAM-Authentifizierung)
      JARVIS_DOCKER: "1"
      # KEIN NODE_TLS_REJECT_UNAUTHORIZED und kein JARVIS_WEBHOOK hier: beides
      # setzt docker/entrypoint.sh fuer die Bridge selbst, und "0" galt fuer den
      # ganzen Node-Prozess, also auch fuer die Verbindungen zu WhatsApp. Der
      # Webhook pinnt certs/server.crt (services/whatsapp-bridge/schutz.js).
      # Web-Login Passwort (Benutzername ist immer "jarvis")
      JARVIS_PASSWORD: "${JARVIS_PASSWORD:-}"
      # !! WICHTIG: Auf die eigene Server-IP setzen – sonst wird das SSL-Zertifikat
      # !! von Windows abgelehnt! Beispiel: SERVER_IP: "1.2.3.4"
      SERVER_IP: "${SERVER_IP:-127.0.0.1}"
      # LLM API-Keys (alternativ im Web-UI unter Einstellungen eintragen)
      # GEMINI_API_KEY: "..."
      # ANTHROPIC_API_KEY: "..."
      # OPENROUTER_API_KEY: "..."
    volumes:
      # Persistente Daten (Memory, Wissensdatenbank, Logs, WhatsApp-Session)
      - jarvis-data:/app/data
      # SSL-Zertifikate (werden beim ersten Start automatisch erstellt)
      - jarvis-certs:/app/certs
      # WhatsApp-Session (Baileys Auth-Daten persistent)
      - wa-session:/app/services/whatsapp-bridge/auth
      # Systemkonfiguration (Broker-Policy, Freigabe-Schluessel, ggf. geheimnis.key).
      # Eigenes Volume, NICHT unter jarvis-data: der Schluessel gehoert nicht
      # neben die verschluesselten Daten – getrennt sichern.
      - jarvis-etc:/etc/jarvis
    shm_size: "256mb"   # Für Browser-Automation empfohlen

# ── Volumes ────────────────────────────────────────────────────────────────────
volumes:
  jarvis-data:
    driver: local
  jarvis-certs:
    driver: local
  wa-session:
    driver: local
  jarvis-etc:
    driver: local
