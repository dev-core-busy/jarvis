<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback</title>
    <link rel="icon" href="/static/favicon.ico">
    <link rel="stylesheet" href="/static/css/theme.css?v=24">
    <link rel="stylesheet" href="/static/css/jira_addon.css?v=13">
    <link rel="stylesheet" href="/static/css/feedback.css?v=5">
</head>
<body>
<script>try{if(localStorage.getItem('jarvis_theme')!=='dark')document.body.classList.add('light');}catch(e){}</script>

<div id="fb-app" class="hidden">
    <header class="topbar">
        <div class="topbar-left">
            <div class="topbar-avatar">J</div>
            <span class="topbar-title"><span class="brand-app-name">Jarvis</span>
                <span data-i18n="feedback.title">Feedback</span></span>
        </div>
        <!-- Symbolgruppe: eigener Container mit gap 4px. Ein flaches Anhaengen an
             .topbar erbt deren gap 10px – genau der Fehler, den
             test_topbar_symbole_ui als Regel prueft. Reihenfolge von RECHTS:
             Abmelden, Einstellungen, Startseite, Hell/Dunkel, Issues. -->
        <div class="topbar-right">
            <div class="lang-toggle" id="fb-lang-toggle">
                <button class="lang-toggle-btn" data-lang="de" onclick="window.setLang && window.setLang('de')" title="Deutsch">DE</button>
                <button class="lang-toggle-btn" data-lang="en" onclick="window.setLang && window.setLang('en')" title="English">EN</button>
            </div>
            <button class="btn-theme jv-issues-btn" id="fb-issues-btn" data-i18n-title="sup.issues" title="Issues / Feedback"
                    onclick="window.JarvisIssues && window.JarvisIssues.open()">
                <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
            </button>
            <button class="btn-theme" id="btn-theme-toggle" title="Hell/Dunkel umschalten" data-i18n-title="chat.theme">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
            </button>
            <button class="btn-theme" id="fb-portal-btn" title="Zum Portal" data-i18n-title="nav.home">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            </button>
            <button class="btn-theme" id="fb-settings-btn" data-jarvis-settings="/feedback" data-i18n-title="nav.settings" title="Einstellungen" style="display:none;">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
            </button>
            <button class="btn-theme" id="fb-logout-btn" data-i18n-title="nav.logout" title="Abmelden">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
            </button>
        </div>
    </header>

    <main class="ja-main">

        <!-- Das Formular. Die Spalten kommen vom Server (ein Administrator
             definiert sie unter Einstellungen → Feedback); die Zeilen legt der
             Benutzer hier an. -->
        <section class="ja-card" data-klapp="form">
            <!-- ⚠ KNOPF UND CARET IN EINEM EIGENEN CONTAINER. `.ja-card-head`
                 ist `justify-content: space-between` – flach angehaengt
                 verteilte es die DREI Kinder gleichmaessig und der Knopf
                 stuende in der Mitte der Zeile. Wenn Elemente als Gruppe
                 wirken sollen, brauchen sie einen gemeinsamen Container
                 (Register, gemeldet fuer /portal). -->
            <div class="ja-card-head" role="button" tabindex="0" aria-expanded="true">
                <h2 data-i18n="feedback.form_h">Formular ausfüllen</h2>
                <span class="fb-head-acts">
                    <button type="button" class="fb-icon-btn" data-act="max" aria-pressed="false"
                            data-i18n-title="feedback.maximize" data-i18n-aria="feedback.maximize"
                            title="Maximieren" aria-label="Maximieren">&#9974;</button>
                    <span class="ja-caret" aria-hidden="true">&#9662;</span>
                </span>
            </div>
            <div class="ja-card-body">

            <!-- Die Auswahl erscheint nur bei MEHREREN Formularen: ein Pulldown
                 mit genau einem Eintrag ist ein Bedienelement ohne Wahl. -->
            <div class="fb-pick hidden" id="fb-pick">
                <label for="fb-form-sel" data-i18n="feedback.pick">Formular</label>
                <select id="fb-form-sel"></select>
            </div>

            <p class="ja-note" id="fb-form-desc"></p>

            <div id="fb-tabelle"></div>

            <div class="ja-dl">
                <button type="button" class="ja-btn" id="fb-zeile-neu"
                        data-i18n="feedback.row_new">+ Zeile</button>
                <button type="button" class="ja-btn ja-btn-haupt" id="fb-senden"
                        data-i18n="feedback.send">Absenden</button>
            </div>
            <div id="fb-status" class="fb-status" role="status" aria-live="polite"></div>
            </div>
        </section>

        <!-- Die eigenen Abgaben. Bewusst NUR die eigenen – wer alle auswerten
             will, nimmt den Einstellungs-Reiter. -->
        <section class="ja-card" id="fb-meine-card" data-klapp="meine">
            <div class="ja-card-head" role="button" tabindex="0" aria-expanded="true">
                <h2 data-i18n="feedback.mine_h">Meine Abgaben</h2>
                <span class="ja-caret" aria-hidden="true">&#9662;</span>
            </div>
            <div class="ja-card-body">

            <p class="ja-note" data-i18n="feedback.mine_p">Was du bisher abgeschickt
                hast. Eine abgeschickte Abgabe lässt sich nicht mehr ändern – schick
                bei einer Korrektur einfach eine neue ab.</p>
            <div id="fb-meine"></div>
            </div>
        </section>
    </main>
</div>

<script src="/static/js/icons.js?v=5"></script>
<script src="/static/js/dlkey.js?v=2"></script>
<script src="/static/js/cpubar.js?v=1"></script>
<script src="/static/js/syspackages.js?v=2"></script>
<script src="/static/js/theme.js?v=3"></script>
<script src="/static/js/i18n.js?v=271"></script>
<script src="/static/js/branding.js?v=26"></script>
<script src="/static/js/sessions.js?v=8"></script>
<script src="/static/js/logo_home.js?v=1"></script>
<script src="/static/js/settings_btn.js?v=4"></script>
<script src="/static/js/activity.js?v=2"></script>
<script src="/static/js/issues.js?v=12"></script>
<script src="/static/js/feedback.js?v=4"></script>
</body>
</html>
